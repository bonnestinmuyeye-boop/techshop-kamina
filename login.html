<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | TechShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="logo" style="text-align: center; margin-bottom: 20px;">Tech<span>Shop</span></div>
        <h2 id="auth-title">Connexion</h2>
        <p id="auth-subtitle" style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px; text-align: center;">Connectez-vous pour finaliser vos achats</p>
        
        <form id="auth-form" onsubmit="gererAuthentification(event)">
            <div class="form-group">
                <label for="auth-email">Adresse Gmail</label>
                <input type="email" id="auth-email" placeholder="votrecompte@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="auth-password">Mot de passe</label>
                <input type="password" id="auth-password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="auth-submit-btn" class="confirm-order-btn">Se connecter</button>
        </form>
        
        <div class="auth-switch">
            <p id="auth-switch-text">Pas encore de compte ? <a href="#" onclick="basculerModeAuth(event)">Créer un compte</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
