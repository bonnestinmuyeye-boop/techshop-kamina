<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Admin | TechShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

    <header>
        <div class="logo">Tech<span>Shop</span> <small class="badge-admin">Admin</small></div>
        <nav>
            <button class="filter-btn" onclick="deconnexionAdmin()">Déconnexion</button>
        </nav>
    </header>

    <main class="admin-layout">
        <section class="admin-control-panel">
            <h2>Gestion du Catalogue Équipements</h2>
            
            <div class="admin-category-selectors">
                <button class="admin-tab-btn active" id="tab-computers" onclick="changerCategorieAdmin('Ordinateurs')">💻 Ordinateurs</button>
                <button class="admin-tab-btn" id="tab-smartphones" onclick="changerCategorieAdmin('Smartphones')">📱 Smartphones</button>
                <button class="admin-tab-btn" id="tab-accessories" onclick="changerCategorieAdmin('Accessoires')">🎧 Accessoires</button>
            </div>

            <div class="admin-add-box">
                <h3 id="form-admin-title">Ajouter un produit dans : Ordinateurs</h3>
                <form id="admin-product-form" onsubmit="ajouterNouveauProduitAdmin(event)">
                    <div class="form-group">
                        <label>Nom du produit</label>
                        <input type="text" id="admin-p-name" placeholder="Ex: HP Spectre x360" required>
                    </div>
                    <div class="form-group">
                        <label>Caractéristiques techniques</label>
                        <input type="text" id="admin-p-specs" placeholder="Ex: Core i7 - 16Go RAM - 1To SSD" required>
                    </div>
                    <div class="form-group-row">
                        <div class="form-group">
                            <label>Prix ($)</label>
                            <input type="number" id="admin-p-price" placeholder="1200" required>
                        </div>
                        <div class="form-group">
                            <label>Lien URL de l'image (Internet)</label>
                            <input type="url" id="admin-p-image" placeholder="https://exemple.com/image.jpg" required>
                        </div>
                    </div>
                    <button type="submit" class="add-btn-large" style="width: 100%;">Enregistrer l'équipement</button>
                </form>
            </div>

            <h3>Équipements actuellement en ligne</h3>
            <div class="admin-products-list" id="admin-products-list-container"></div>
        </section>

        <section class="admin-users-panel">
            <h2>Utilisateurs Inscrit & Connectés</h2>
            <div class="users-list-wrapper" id="admin-users-container">
                </div>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
